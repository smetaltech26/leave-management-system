<div class="bg-[var(--bg-secondary)] p-6 rounded-2xl shadow-[var(--shadow)] fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
    <h3 class="font-bold text-lg">ข้อมูลประชาสัมพันธ์</h3>
    
    <div class="flex items-center gap-2 max-w-md w-full sm:w-auto">
      <div class="relative flex-1">
        <input type="search" id="searchManagerDB" class="form-input" placeholder="ค้นหาข้อมูล..." oninput="filterManagerDB()">
        <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)] pointer-events-none"></i>
      </div>
    </div>
  </div>

  <div id="announcements-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<script>
let filteredManagerDB = [];

const renderManagerDB = (data) => {
  const announcementsContainer = document.getElementById('announcements-container');
  announcementsContainer.innerHTML = '';

  if (data.length === 0) {
    announcementsContainer.innerHTML = `
      <div class="col-span-full flex flex-col items-center justify-center min-h-[200px] text-center space-y-2">
        <div class="text-4xl text-[var(--text-secondary)]">
          <i class="fas fa-folder-open"></i>
        </div>
        <p class="text-[var(--text-secondary)] text-base">ไม่พบข้อมูล! 😓</p>
      </div>
    `;
    return;
  }

  data.sort((a, b) => {
    const [dayA, monthA, yearA] = a[3].split('/').map(Number);
    const [dayB, monthB, yearB] = b[3].split('/').map(Number);
    const dateA = new Date(yearA, monthA - 1, dayA);
    const dateB = new Date(yearB, monthB - 1, dayB);
    return dateB - dateA;
  });

  data.forEach(rowIndex => {
    const user = getSearchUsers(rowIndex[1]);
    const profileImage = user.profile || '';
    const name = user.fullname || 'ไม่พบชื่อ';
    const agency = user.agency || '';
    const department = user.department || '';

    const cardHtml = `
      <div class="announcement-card p-6 rounded-xl flex flex-col justify-between items-start gap-4">
        <div class="flex items-center gap-4 w-full">
            <img src="${profileImage}" alt="${name}" class="announcement-profile-pic">
            <div class="flex-1">
              <h3 class="text-lg font-semibold">${name || '-'}</h3>
              <p class="text-sm text-text-secondary">${agency || '-'} - ${department || '-'}</p>
            </div>
        </div>
        <p class="text-text-primary text-base leading-relaxed mb-4 flex-grow">${rowIndex[2]}</p>
        <div class="flex items-center justify-between w-full mt-auto pt-4 border-t border-border-color">
          <p class="text-sm text-text-secondary">โพสต์เมื่อ: ${rowIndex[3]}</p>
          <button type="button" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium" onclick="openFilePreview('${rowIndex[4]}', '${rowIndex[0]}')">ดูรายละเอียด</button>
        </div>
      </div>
    `;
    announcementsContainer.insertAdjacentHTML('beforeend', cardHtml);
  });
};

const filterManagerDB = () => {
  const query = document.getElementById('searchManagerDB').value.toLowerCase();

  filteredManagerDB = allDataManagerDB.filter(row => {
    return query === '' || row.some(column => column.toLowerCase().includes(query));
  });

  renderManagerDB(filteredManagerDB);
};

const getEmbedUrl = (url) => {
  const match = url.match(/\/d\/([\w-]+)/);
  if (match && match[1]) {
    return 'https://drive.google.com/file/d/' + match[1] + '/preview';
  }
  return url;
};

const openFilePreview = (fileUrl, fileName) => {
  const embedUrl = getEmbedUrl(fileUrl);

  document.getElementById('filePreviewTitle').textContent = fileName;
  document.getElementById('filePreviewFrame').src = embedUrl;
  document.getElementById('fileDownloadLink').href = fileUrl;

  document.getElementById('filePreviewModal').classList.remove('hidden');
};

const closeFilePreview = () => {
  document.getElementById('filePreviewFrame').src = '';
  document.getElementById('filePreviewModal').classList.add('hidden');
};
</script>
