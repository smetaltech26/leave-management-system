<div class="bg-[var(--bg-secondary)] p-6 rounded-2xl shadow-[var(--shadow)] fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
    <h3 class="font-bold text-lg">จัดการฝ่าย</h3>
    
    <div class="flex items-center gap-2 max-w-md w-full sm:w-auto">
      <div class="relative flex-1">
        <input type="search" id="searchDepartments" class="form-input" placeholder="ค้นหาข้อมูล..." oninput="filterDepartments()">
        <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)] pointer-events-none"></i>
      </div>
      <button class="px-4 py-3 text-white bg-green-500 hover:bg-green-600 rounded-lg whitespace-nowrap" onclick="openDepartmentsModal()">
        เพิ่มข้อมูล
      </button>
    </div>
  </div>
  <div class="overflow-x-auto">
      <table class="min-w-full text-sm divide-y divide-gray-200">
          <thead class="border-b border-[var(--border-color)]">
              <tr>
                  <th class="px-4 py-2 text-center whitespace-nowrap">รหัส</th>
                  <th class="px-4 py-2 text-center whitespace-nowrap">ฝ่าย</th>
                  <th class="px-4 py-2 text-center whitespace-nowrap">จัดการ</th>
              </tr>
          </thead>
          <tbody id="tableDepartments"></tbody>
      </table>
  </div>
  <div class="p-4 mt-4 px-4 py-3 rounded-t-xl rounded-b-xl mt-3">
    <div class="flex flex-col items-center justify-between gap-2 text-sm">
      <div id="paginationDepartmentsInfo" class="text-center"></div>
      <div id="paginationDepartments" class="text-center w-full overflow-x-auto py-2"></div>
    </div>
  </div>
</div>

<script>
let filteredDepartments = [];
let currentDepartments = 1;
let itemsPerDepartments = 10;

const renderDepartments = (data) => {
  const table = document.getElementById('tableDepartments');
  table.innerHTML = '';

  const startIndex = (currentDepartments - 1) * itemsPerDepartments;
  const endIndex = startIndex + itemsPerDepartments;
  const pageData = data.slice(startIndex, endIndex);
  const totalRows = data.length;

  const startRow = startIndex + 1;
  const endRow = startIndex + pageData.length;

  document.getElementById('paginationDepartmentsInfo').innerText = `แสดง ${startRow} ถึง ${endRow} จาก ${totalRows} แถว`;

  if (pageData.length === 0) {
    const row = table.insertRow();
    row.innerHTML = `
      <td colspan="3" class="text-center text-[var(--text-secondary)] py-6 text-base">
        ไม่พบข้อมูล! 😓
      </td>`;
    return;
  }

  pageData.forEach((rowIndex) => {

    const row = table.insertRow();
    row.className = 'transition duration-200 ease-in-out';
    row.onmouseover = () => row.style.backgroundColor = 'var(--hover-bg-color)';
    row.onmouseout = () => row.style.backgroundColor = '';

    row.innerHTML = `
      <td class="px-4 py-3 text-sm whitespace-nowrap text-center text-[var(--text-primary)]">${rowIndex[0]}</td>
      <td class="px-4 py-3 text-sm whitespace-nowrap text-center text-[var(--text-primary)]">${rowIndex[1]}</td>
      <td class="px-4 py-3 text-center text-sm whitespace-nowrap">
        <button class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded-lg text-sm font-medium transition duration-200 ease-in-out shadow-sm hover:shadow-md mr-1"
          onclick="editDepartments('${rowIndex[0]}')">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium transition duration-200 ease-in-out shadow-sm hover:shadow-md"
          onclick="delDepartments('${rowIndex[0]}')">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </td>
    `;
  });

  renderPageDepartments(totalRows);
};

const renderPageDepartments = (totalItems) => {
  const totalPages = Math.ceil(totalItems / itemsPerDepartments);
  const paginationContainer = document.getElementById('paginationDepartments');
  paginationContainer.innerHTML = '';

  const ul = document.createElement('ul');
  ul.className = "custom-pagination";

  const createPageButton = (htmlContent, page, isDisabled = false, isActive = false) => {
    const li = document.createElement('li');
    if (isDisabled) li.classList.add('disabled');
    if (isActive) li.classList.add('active');

    const button = document.createElement('button');
    button.innerHTML = htmlContent;
    button.addEventListener('click', () => {
      if (!isDisabled) {
        currentDepartments = page;
        const dataToRender = filteredDepartments.length ? filteredDepartments : allDataDepartments;
        renderDepartments(dataToRender);
      }
    });
    li.appendChild(button);
    return li;
  };

  ul.appendChild(createPageButton('<i class="fa-solid fa-angles-left"></i>', 1, currentDepartments === 1));
  ul.appendChild(createPageButton('<i class="fa-solid fa-angle-left"></i>', currentDepartments - 1, currentDepartments === 1));

  let startPage, endPage;
  if (totalPages <= 3) {
    startPage = 1;
    endPage = totalPages;
  } else {
    if (currentDepartments <= 2) {
      startPage = 1;
      endPage = 3;
    } else if (currentDepartments + 1 >= totalPages) {
      startPage = totalPages - 2;
      endPage = totalPages;
    } else {
      startPage = currentDepartments - 1;
      endPage = currentDepartments + 1;
    }
  }

  for (let i = startPage; i <= endPage; i++) {
    ul.appendChild(createPageButton(i, i, false, currentDepartments === i));
  }

  ul.appendChild(createPageButton('<i class="fa-solid fa-angle-right"></i>', currentDepartments + 1, currentDepartments === totalPages));
  ul.appendChild(createPageButton('<i class="fa-solid fa-angles-right"></i>', totalPages, currentDepartments === totalPages));

  paginationContainer.appendChild(ul);
}

const filterDepartments = () => {
  const query = document.getElementById('searchDepartments').value.toLowerCase();

  filteredDepartments = allDataDepartments.filter(row => {
    return query === '' || row.some(column => column.toLowerCase().includes(query));
  });

  currentDepartments = 1;
  renderDepartments(filteredDepartments);
};

const openDepartmentsModal = () => {
  document.getElementById('departmentsModal').classList.remove('hidden');
}

const closeDepartmentsModal = () => {
  document.getElementById('departmentsModal').classList.add('hidden');
  $("#modalDepartmentsTitle").text('เพิ่มฝ่ายงานใหม่');
  $("#departmentsDataKye").val('');
  $("#departmentsData1").val('');
}

const submitModalDepartments = () => {
  event.preventDefault();
  $("#customLoader").show();

  const obj = {
    datakey: document.getElementById('departmentsDataKye').value,
    data1: document.getElementById('departmentsData1').value       
  };

  if (!obj.data1) {
    showToast("กรุณากรอกข้อมูลให้ครบถ้วน", "warning");
    $("#customLoader").hide();
    return;
  }

  if (!obj.datakey) {
    google.script.run.withSuccessHandler(async (res) => {
      closeDepartmentsModal();
      await updateSpecificDataDepartments();
      $("#customLoader").hide();
      showToast("บันทึกข้อมูลสำเร็จ", "success");
    }).addDepartments(obj);
  } else {
    google.script.run.withSuccessHandler(async (res) => {
      closeDepartmentsModal();
      await updateSpecificDataDepartments();
      $("#customLoader").hide();
      showToast("แก้ไขข้อมูลสำเร็จ", "success");
    }).upDepartments(obj);
  }
}

const editDepartments = (codeID) => {
  const rowIndex = allDataDepartments.find(row => row[0].trim() === codeID.trim());

  if (!rowIndex) {
    showToast("ไม่พบข้อมูลที่เลือกในระบบ", "warning");
    return;
  }
  openDepartmentsModal();
  $("#modalDepartmentsTitle").text('แก้ไขฝ่ายงาน');
  $('#departmentsDataKye').val(rowIndex[0]);
  $('#departmentsData1').val(rowIndex[1]);
}

const delDepartments = (codeID) => {
  let rowIndex = allDataDepartments.find(row => row[0].trim() === codeID.trim());
  
  if (!rowIndex) {
    showToast("ไม่พบข้อมูลที่เลือกในระบบ", "warning");
    return;
  }

  if (rowIndex) {
    $('#confirmBtnDel').off('click').on('click', function() {
      document.getElementById('DelDataModal').classList.add('hidden');
      $("#customLoader").show();
      google.script.run.withSuccessHandler(async (res) => {
        rowIndex = allDataDepartments.filter(row => row[0] !== codeID);
        await updateSpecificDataDepartments();
        $("#customLoader").hide();
        showToast("ลบข้อมูลสำเร็จ", "success");
      }).delDataDepartments(codeID);
    });
    $('#xDelconfirmData').off('click').on('click', function() {
      document.getElementById('DelDataModal').classList.add('hidden');
    });
    document.getElementById('DelDataModal').classList.remove('hidden');
  }
}
</script>
