$(document).ready(function() {
    const dashboard = document.querySelector('.admin-dashboard');
    const sidebarOverlay = document.querySelector('.sidebar-overlay');

    if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', () => {
            dashboard.classList.remove('sidebar-mobile-show');
        });
    }

    window.addEventListener('resize', () => {
        if (dashboard) {
            if (window.innerWidth <= 992) {
                dashboard.classList.remove('sidebar-collapsed');
                dashboard.classList.remove('sidebar-mobile-show');
            } else {
                dashboard.classList.remove('sidebar-mobile-show');
                if (localStorage.getItem('sidebarState') === 'collapsed') {
                    dashboard.classList.add('sidebar-collapsed');
                }
            }
            updateCollapsedState();
        }
    });

    document.querySelectorAll('.sidebar-menu-list a').forEach(link => {
        link.addEventListener('click', (e) => {
            const parentMenuItem = link.closest('.sidebar-menu-item');
            if (parentMenuItem && !parentMenuItem.classList.contains('has-submenu') && 
                dashboard && dashboard.classList.contains('sidebar-mobile-show')) {
                dashboard.classList.remove('sidebar-mobile-show');
            }
        });
    });

    const allSideMenuItems = document.querySelectorAll('.sidebar-menu-list > .sidebar-menu-item');
    const allSubmenuToggleLinks = document.querySelectorAll('.sidebar-menu-list .has-submenu .sidebar-menu-item-link');
    const allSubmenus = document.querySelectorAll('.submenu');
    const allSubmenuArrows = document.querySelectorAll('.submenu-arrow');

    allSubmenuToggleLinks.forEach((link, index) => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const submenu = allSubmenus[index];
            const arrow = allSubmenuArrows[index];

            allSubmenus.forEach((sm, smIndex) => {
                if (sm !== submenu) {
                    sm.classList.remove('show');
                    allSubmenuArrows[smIndex].classList.remove('rotated');
                }
            });

            submenu.classList.toggle('show');
            arrow.classList.toggle('rotated');
        });
    });

    allSideMenuItems.forEach((item) => {
        const link = item.querySelector('.sidebar-menu-item-link');
        if (link && !item.classList.contains('has-submenu')) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const menuId = item.id;
                const pageNumber = menuId.replace('sidebarManu', '');
                if (pageNumber && typeof changePage === 'function') {
                    changePage(parseInt(pageNumber));
                }
            });
        }
    });

    if (localStorage.getItem('sidebarState') === 'collapsed' && window.innerWidth > 992 && dashboard) {
        dashboard.classList.add('sidebar-collapsed');
    }
    updateCollapsedState();

    document.querySelectorAll('.notification-item').forEach(item => {
        item.addEventListener('click', () => {
            item.classList.remove('unread');
            if (typeof updateNotificationBadge === 'function') {
                updateNotificationBadge();
            }
        });
    });

    const updateAllThemes = (isDark) => {
        if (isDark) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        
        document.querySelectorAll('.dark-mode-switch .slider i, .dark-mode-toggle .slider i').forEach(icon => {
            if (isDark) {
                icon.classList.remove('bxs-sun');
                icon.classList.add('bxs-moon');
            } else {
                icon.classList.remove('bxs-moon');
                icon.classList.add('bxs-sun');
            }
        });
    };

    const savedTheme = localStorage.getItem('theme');
    updateAllThemes(savedTheme === 'dark');

    window.addEventListener('storage', (e) => {
        if (e.key === 'theme') {
            updateAllThemes(e.newValue === 'dark');
        }
    });

    document.addEventListener('click', (e) => {
        const dropdown = document.querySelector('.notification-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            dropdown.classList.remove('active');
        }
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'theme') {
            if (e.newValue === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            document.querySelectorAll('.dark-mode-toggle .slider i, .dark-mode-switch .slider i').forEach(icon => {
                if (document.body.classList.contains('dark')) {
                    icon.classList.remove('bxs-sun');
                    icon.classList.add('bxs-moon');
                } else {
                    icon.classList.remove('bxs-moon');
                    icon.classList.add('bxs-sun');
                }
            });
        }
    });

});

const toggleDarkMode = () => {
  document.body.classList.toggle('dark');
  
  document.querySelectorAll('.dark-mode-toggle .slider i, .dark-mode-switch .slider i').forEach(icon => {
      if (document.body.classList.contains('dark')) {
          icon.classList.remove('bxs-sun');
          icon.classList.add('bxs-moon');
          localStorage.setItem('theme', 'dark');
      } else {
          icon.classList.remove('bxs-moon');
          icon.classList.add('bxs-sun');
          localStorage.setItem('theme', 'light');
      }
  });
}

const setDisPlayMenu = (status, menuItems) => {
  const allMenuItems = Object.keys(menuItems);
  allMenuItems.forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.style.display = "none";
    }
  });
  for (const item in menuItems) {
    if (menuItems[item][status]) {
      const element = document.getElementById(item);
      if (element) {
        element.style.display = "block";
      }
    }
  }
}

const simpleEncrypt = (text) => {
  return btoa(text);
};

const simpleDecrypt = (encryptedText) => {
  try {
    return atob(encryptedText);
  } catch {
    return '';
  }
};

const handleRememberMe = (username, password, shouldRemember) => {
  if (shouldRemember) {
    localStorage.setItem('rememberUsername', username);
    localStorage.setItem('rememberPassword', simpleEncrypt(password));
    localStorage.setItem('rememberMe', 'true');
  } else {
    localStorage.removeItem('rememberUsername');
    localStorage.removeItem('rememberPassword');
    localStorage.removeItem('rememberMe');
  }
};

const loadRememberedData = () => {
  const rememberedUsername = localStorage.getItem('rememberUsername');
  const rememberedPassword = localStorage.getItem('rememberPassword');
  const isRemembered = localStorage.getItem('rememberMe') === 'true';

  if (rememberedUsername) {
    document.getElementById("loginusername").value = rememberedUsername;
  }
  
  if (rememberedPassword && isRemembered) {
    document.getElementById("loginpassword").value = simpleDecrypt(rememberedPassword);
  }
  
  if (isRemembered) {
    document.getElementById("rememberMe").checked = true;
  }
};

const setUserSession = (userData) => {
  const sessionData = {
    uiduser: userData.uiduser,
    username: userData.username,
    fullname: userData.fullname,
    agency: userData.agency,
    department: userData.department,
    role: userData.role,
    imgUser: userData.imgUser,
    sigUser: userData.sigUser,
    status: userData.status,
    password: userData.password || ''
  };

  Object.keys(sessionData).forEach(key => {
    localStorage.setItem(key, sessionData[key]);
  });
  
  localStorage.setItem('isLoggedIn', 'true');
  localStorage.setItem('loginTime', new Date().getTime());
};

const clearUserSession = () => {
  const sessionKeys = [
    'uiduser', 'username', 'fullname', 'agency', 'department', 
    'role', 'imgUser', 'sigUser', 'status', 'password',
    'isLoggedIn', 'loginTime'
  ];
  
  sessionKeys.forEach(key => {
    localStorage.removeItem(key);
  });
};

const isSessionExpired = () => {
  const loginTime = localStorage.getItem('loginTime');
  if (!loginTime) return true;
  
  const currentTime = new Date().getTime();
  const sessionDuration = 24 * 60 * 60 * 1000;
  
  return (currentTime - parseInt(loginTime)) > sessionDuration;
};

const loadingAPI = async () => {
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  
  if (isLoggedIn === 'true' && isSessionExpired()) {
    clearUserSession();
    showToast("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่", "warning");
  }
  
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    $("#pageformLogin").show();
    $("#dashboardPage").hide();
    $("#customLoader").hide();
    return;
  }

  $("#pageformLogin").hide();
  $("#dashboardPage").show();
  $("#customLoader").show();

  try {
    await Promise.all([
      await fetchAllData()
    ]);
    showChart();
    updateAllDropdownsFrom();
    renderCalendar();
    renderApprovalSteps();
    setTimeout(() => {
      checkAllInputs();
    }, 100);
    initRealTime();
    $("#customLoader").hide();
  } catch (err) {
    console.error("โหลดข้อมูลบางส่วนล้มเหลว:", err);
    $("#customLoader").hide();
    showToast("โหลดข้อมูลล้มเหลว", "error");
  }
};

document.addEventListener("DOMContentLoaded", function () {
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  
  if (isLoggedIn !== 'true' || isSessionExpired()) {
    clearUserSession();
  } else {
    let datauser = {
      uiduser: localStorage.getItem('uiduser'),
      username: localStorage.getItem('username'),
      fullname: localStorage.getItem('fullname'),
      agency: localStorage.getItem('agency'),
      department: localStorage.getItem('department'),
      role: localStorage.getItem('role'),
      imgUser: localStorage.getItem('imgUser'),
      sigUser: localStorage.getItem('sigUser'),
      status: localStorage.getItem('status'),
      password: localStorage.getItem('password')
    };
    google.script.run.withSuccessHandler(function(menuItems) {
      setDisPlayMenu(datauser.role, menuItems);
    }).getMenuItems();
    loginUserSuc(datauser);
  }
  
  loadRememberedData();
});

const loginUsers = async () => {
  event.preventDefault();
  $("#customLoader").show();
  
  const usernameCheck = $("#loginusername").val().trim();
  const passwordCheck = $("#loginpassword").val();
  const rememberMeChecked = document.getElementById("rememberMe").checked;

  if (!usernameCheck || !passwordCheck) {
    $("#customLoader").hide();
    showToast("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน", "error");
    return;
  }

  google.script.run.withSuccessHandler(function(datauser) {
    $("#customLoader").hide();
    
    if (typeof datauser === 'object' && datauser !== null) {
      showToast("เข้าสู่ระบบสำเร็จ " + datauser.fullname, "success");
      
      handleRememberMe(usernameCheck, passwordCheck, rememberMeChecked);
      
      setUserSession(datauser);
      
      loadingAPI().then(() => {
        $("#customLoader").hide();
      });
      google.script.run.withSuccessHandler(function(menuItems) {
        setDisPlayMenu(datauser.role, menuItems);
      }).getMenuItems();
      loginUserSuc(datauser);
      
    } else {
      showToast("ไม่พบข้อมูลผู้ใช้งาน กรุณาตรวจสอบอีกครั้ง", "error");
      $("#pageformLogin").show();
      $("#dashboardPage").hide();
    }
  }).withFailureHandler(function(error) {
    $("#customLoader").hide();
    console.error("Login error:", error);
    showToast("เกิดข้อผิดพลาดในการเข้าสู่ระบบ", "error");
  }).checkUsers(usernameCheck, passwordCheck);
};

const loginUserSuc = (datauser) => {

  $('#editLastName').val(lastName || '');

  $('#editPassword').val(datauser.password || '');

  if (datauser.imgUser) {
    $('#editProfilePictureArea').css('background-image', `url(${datauser.imgUser})`)

  }

  if (datauser.sigUser) {
    $('#editSignatureArea').css('background-image', `url(${datauser.sigUser})`)

  }
};

const fetchSettingData = () => {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(settings => {
      apiKey = settings.idapi;
      sheetWebAppA = settings.idsheetA;
      sheetWebAppB = settings.idsheetB;
      //console.log('Settings loaded:', settings);
      resolve();
    }).withFailureHandler(error => {
      //console.error('Error fetching settings:', error);
      reject(error);
    }).getSettingData();
  });
};

async function fetchDataFromAPI(sheetId, sheetName) {
  if ((!sheetWebAppA || !sheetWebAppB) || !apiKey) {
    await fetchSettingData();
  }
  const apiUrl = "https://sheets.googleapis.com/v4/spreadsheets/" + sheetId + "/values/" + sheetName + "?alt=json&key=" + apiKey;
  return fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      return data.values.slice(1);
    })
  .catch(error => {
    alert(`❌ เกิดข้อผิดพลาดในการดึงข้อมูล: ${error.message}`, 0);
    return [];
  });
}

function dataHasChanged(newData, oldData) {
  if (!oldData || newData.length !== oldData.length) return true;
  return JSON.stringify(newData) !== JSON.stringify(oldData);
}

const fetchAllData = async () => {
  await fetchSettingData();
  // const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  try {
    const [datausers, datamenu, dataagency, datadepartments, datapolicies, dataholidays, datadayofweek, dataleaverequests, dataapprovalsteps, dataattachments, datamanager] = await Promise.all([
      fetchDataFromAPI(sheetWebAppA, 'Users'),
      fetchDataFromAPI(sheetWebAppA, 'UsersMenu'),
      fetchDataFromAPI(sheetWebAppA, 'Agency'),
      fetchDataFromAPI(sheetWebAppA, 'Departments'),
      fetchDataFromAPI(sheetWebAppA, 'UserPolicies'),
      fetchDataFromAPI(sheetWebAppA, 'Holidays'),
      fetchDataFromAPI(sheetWebAppA, 'DayOfWeek'),
      fetchDataFromAPI(sheetWebAppB, 'LeaveRequests'),
      fetchDataFromAPI(sheetWebAppB, 'ApprovalSteps'),
      fetchDataFromAPI(sheetWebAppB, 'Attachments'),
      fetchDataFromAPI(sheetWebAppB, 'ManagerDB')
    ]);

    allDataUsers = datausers;
    allDataMenu = datamenu;
    allDataAgency = dataagency;
    allDataDepartments = datadepartments;
    allDataUserPolicies = datapolicies;
    allDataHolidays = dataholidays
    allDataDayOfWeek = datadayofweek

    allDataLeaveRequests = dataleaverequests;
    allDataApprovalSteps = dataapprovalsteps;
    allDataAttachments = dataattachments;
    allDataManagerDB = datamanager;

    await checkDataUsers(datausers);
    await checkDataMenu(datamenu);
    await checkDataAgency(dataagency);
    await checkDataDepartments(datadepartments);
    await checkDataUserPolicies(datapolicies);
    await checkDataHolidays(dataholidays);
    await checkDataDayOfWeek(datadayofweek);

    await checkDataLeaveRequests(dataleaverequests);
    await checkDataApprovalSteps(dataapprovalsteps);
    await checkDataAttachments(dataattachments);
    await checkDataManagerDB(datamanager);

    return true;
  } catch (error) {
    console.error("เกิดข้อผิดพลาดในการดึงข้อมูล", error);
    alert(`❌ เกิดข้อผิดพลาดในการดึงข้อมูล: ${error.message}`, 0);
  }
};

const updateDropdowns = (dataSource, valueIndex, labelIndex, selectIds) => {
  if (!Array.isArray(dataSource) || dataSource.length === 0) return;

  const uniqueOptions = [...new Map(
    dataSource
      .filter(row => row[valueIndex] && row[labelIndex])
      .map(row => [row[valueIndex], row])
  ).values()];

  selectIds.forEach(selectId => {
    const selectElement = document.getElementById(selectId);
    if (selectElement) {
      selectElement.innerHTML = '';

      const firstOption = document.createElement("option");
      firstOption.value = '';
      firstOption.text = 'กรุณาเลือกรายการ';
      firstOption.disabled = true;
      firstOption.selected = true;
      selectElement.appendChild(firstOption);

      uniqueOptions.forEach(row => {
        const option = document.createElement("option");
        option.value = row[valueIndex];
        option.text = row[labelIndex];
        selectElement.appendChild(option);
      });
    }
  });
};

let toastTimer = null;

const showToast = (message, type = 'info') => {
  const toast = document.getElementById('toast');
  const toastIcon = document.getElementById('toastIcon');
  const toastMessage = document.getElementById('toastMessage');

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toast.className = 'toast-notification';

  let iconClass = '';
  let typeClass = '';
  let bgColor = '';

  switch (type) {
    case 'success':
      iconClass = 'bx bx-check-circle';
      typeClass = 'toast-success';
      bgColor = 'var(--bs-green)';
      break;
    case 'error':
      iconClass = 'bx bx-x-circle';
      typeClass = 'toast-error';
      bgColor = 'var(--bs-red)';
      break;
    case 'warning':
      iconClass = 'bx bx-error';
      typeClass = 'toast-warning';
      bgColor = 'var(--bs-yellow)';
      break;
    default:
      iconClass = 'bx bx-info-circle';
      typeClass = 'toast-info';
      bgColor = 'var(--bs-purple)';
      break;
  }

  toastIcon.className = iconClass;
  toastMessage.textContent = message;
  toast.classList.add(typeClass);

  setTimeout(() => {
    toast.classList.add('show');
  }, 10);

  toastTimer = setTimeout(() => {
    hideToast();
  }, 4000);

  const logEntry = {
    status: message,
    timestamp: Date.now(),
    type: type,
    name: localStorage.getItem('fullname') || 'ระบบ'
  };

  const logs = JSON.parse(localStorage.getItem('alertLogs') || '[]');
  const newLogs = [logEntry, ...logs].slice(0, 50);
  localStorage.setItem('alertLogs', JSON.stringify(newLogs));

  renderNotificationList();
  updateNotificationBadge();
};

const hideToast = () => {
  const toast = document.getElementById('toast');
  toast.classList.remove('show');

  if (toastTimer) {
    clearTimeout(toastTimer);
    toastTimer = null;
  }
};

const renderNotificationList = () => {
  const container = document.querySelector('.notification-list');
  container.innerHTML = '';

  const logs = JSON.parse(localStorage.getItem('alertLogs') || '[]');

  if (logs.length === 0) {
    container.innerHTML = `<div class="p-4 text-center text-gray-500 text-sm">ไม่มีการแจ้งเตือน</div>`;
  }

  logs.forEach((item) => {
    const timeText = getRelativeTime(item.timestamp);

    let iconClass = '';
    let bgColor = '';

    switch (item.type) {
      case 'success': iconClass = 'bx bx-check-circle'; bgColor = 'var(--bs-green)'; break;
      case 'error': iconClass = 'bx bx-x-circle'; bgColor = 'var(--bs-red)'; break;
      case 'warning': iconClass = 'bx bx-error'; bgColor = 'var(--bs-yellow)'; break;
      default: iconClass = 'bx bx-info-circle'; bgColor = 'var(--bs-purple)'; break;
    }

    const div = document.createElement('div');
    div.className = 'notification-item';
    if (!item.read) div.classList.add('unread');

    div.innerHTML = `
      <div class="notification-icon" style="background-color: ${bgColor};">
        <i class="${iconClass}"></i>
      </div>
      <div class="notification-content">
        <div class="notification-message">${item.status}</div>
        <div class="notification-time" data-timestamp="${item.timestamp}">${timeText}</div>
      </div>
    `;

    container.appendChild(div);
  });
};

const getRelativeTime = (timestamp) => {
  const now = Date.now();
  const diff = Math.floor((now - timestamp) / 1000);

  if (diff < 60) return `${diff} วินาทีที่แล้ว`;
  if (diff < 3600) return `${Math.floor(diff / 60)} นาทีที่แล้ว`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} ชั่วโมงที่แล้ว`;

  return new Date(timestamp).toLocaleString('th-TH');
};

const showGetRequests = () => {

        const hasPrevious = Array.isArray(previousDataLeaveRequests);

          console.log("⏱️ Updated LeaveRequests:", updatedIDs);

            newIDs.forEach(id => showToast(`รายการ ${id} คำขอใหม่`, "success"));
          }
        }

        allDataLeaveRequests = data;
        previousDataLeaveRequests = JSON.parse(JSON.stringify(data));
        isLoadRequests = false;
        resolve();
      })
      .withFailureHandler((err) => {
        console.error("❌ โหลด LeaveRequests ล้มเหลว:", err);
        reject(err);
      })
      .getDataLeaveRequests();
  });
};

const getUpdatedItems = (newData, oldData) => {
  const updatedItems = [];
  const oldDataMap = new Map();
  oldData.forEach(item => oldDataMap.set(item[0], item));

  newData.forEach(item => {
    const oldItem = oldDataMap.get(item[0]);
    if (!oldItem) return;
    if (JSON.stringify(item) !== JSON.stringify(oldItem)) {
      updatedItems.push(item[0]);
    }
  });

  return updatedItems;
}

const getNewItems = (newData, oldData) => {
  const oldIDs = new Set(oldData.map(item => item[0]));
  const newItems = [];

  newData.forEach(item => {
    if (!oldIDs.has(item[0])) {
      newItems.push(item[0]);
    }
  });

  return newItems;
}

};

  }, interval);
};

let requestsInterval = null;
let approvalsInterval = null;
let usersInterval = null;
let isRealTimeActive = false;

const startRealTime = () => {
  if (!requestsInterval) requestsInterval = startRequestsTime(10000);
  if (!approvalsInterval) approvalsInterval = startApprovalsTime(10000);
  if (!usersInterval) usersInterval = startUsersTime(10000);

  isRealTimeActive = true;
  localStorage.setItem('realTimeActive', 'true');
  showToast('เปิดโหมดเรียลไทม์แล้ว', 'success');
  updateRealtimeToggleUI(true);
};

const stopRealTime = () => {
  if (requestsInterval) clearInterval(requestsInterval);
  if (approvalsInterval) clearInterval(approvalsInterval);
  if (usersInterval) clearInterval(usersInterval);

  requestsInterval = null;
  approvalsInterval = null;
  usersInterval = null;

  isRealTimeActive = false;
  localStorage.setItem('realTimeActive', 'false');
  showToast('ปิดโหมดเรียลไทม์แล้ว', 'warning');
  updateRealtimeToggleUI(false);
};

const toggleRealTime = () => {
  const toggle = document.getElementById('realtimeToggle');
  if (toggle?.checked) {
    startRealTime();
  } else {
    stopRealTime();
  }
};

const updateRealtimeToggleUI = (state) => {
  const toggle = document.getElementById('realtimeToggle');
  if (toggle) {
    toggle.checked = state;
  }
};

const initRealTime = () => {
  const savedState = localStorage.getItem('realTimeActive') === 'true';
  if (savedState) startRealTime();
  else stopRealTime();

  updateRealtimeToggleUI(savedState);
};
