<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<style>
:root {
  --bs-white: #fff;
  --bs-gray: #6c757d;
  --bs-blue: #3c8cf3;
  --bs-green: #05be8a;
  --bs-purple: #745af2;
  --bs-red: #ef5350;
  --bs-yellow: #ffa726;

  --padding-body: 1.25rem;
  --sidebar-width: 280px;
  --sidebar-width-collapsed: 90px;
  --navbar-height: 70px;
  
  /* Default Light Theme */
  --bg-primary: #f3f4f8;
  --bg-secondary: #ffffff;
  --text-primary: #333333;
  --text-secondary: #6c757d;
  --border-color: #e9e9e9;
  --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);

  --hover-bg-color: #f3f4f6;
}

body.dark {
  --bg-primary: #1a1a2e;
  --bg-secondary: #232946;
  --text-primary: #e4e6eb;
  --text-secondary: #b8c1ec;
  --border-color: #3a3f5a;
  --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
  --card: #232946;

  --hover-bg-color: #2a2d3a;
}

/* === BASE STYLES === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Prompt', sans-serif;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  transition: background-color .3s ease, color .3s ease;
  min-height: 100vh;
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-thumb {
  border-radius: 6px;
}

/* === LAYOUTS === */
.admin-dashboard {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  padding: var(--padding-body);
  padding-top: calc(var(--navbar-height) + var(--padding-body) * 2);
  transition: background-color .3s ease, color .3s ease;
  min-height: 100vh;
}

.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  overflow-y: auto;
}

/* === CONTAINERS === */
.sidebar,
.navbar,
.auth-container {
  background: var(--bg-secondary);
  border-radius: 1rem;
  box-shadow: var(--shadow);
  transition: all .3s ease;
}

.sidebar {
  position: fixed;
  top: var(--padding-body);
  left: var(--padding-body);
  bottom: var(--padding-body);
  width: var(--sidebar-width);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.navbar {
  position: fixed;
  top: var(--padding-body);
  left: calc(var(--sidebar-width) + var(--padding-body) * 2); 
  right: var(--padding-body);
  height: var(--navbar-height);
  z-index: 999;
  display: flex;
  align-items: center;
  padding: 0 1.5rem;
}

.auth-container {
  padding: 2rem;
  max-width: 520px;
  width: 100%;
  position: relative;
}

.main-content {
  padding-left: calc(var(--sidebar-width) + var(--padding-body));
  transition: padding-left .3s ease;
}

/* === SIDEBAR STATES === */
.admin-dashboard.sidebar-collapsed .sidebar {
  width: var(--sidebar-width-collapsed);
}

.admin-dashboard.sidebar-collapsed .main-content {
  padding-left: calc(var(--sidebar-width-collapsed) + var(--padding-body));
}

.admin-dashboard.sidebar-collapsed .navbar {
  left: calc(var(--sidebar-width-collapsed) + var(--padding-body) * 2);
}

/* === MENU COMPONENTS === */
.sidebar-menu {
  flex-grow: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: 0.5rem;
}

.sidebar-menu-list {
  list-style: none;
  padding: 0;
  margin: 0;
  flex-grow: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar-menu-header {
  height: 32px;
  padding: 4px 1rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity .3s ease;
  margin-top: 1rem;
}

.sidebar-menu-header:first-child {
  margin-top: 0.5rem;
}

.sidebar-menu-item {
  position: relative;
  height: 50px;
  border-radius: 0.5rem 0 0 0.5rem;
  padding: 4px 10px 0px 15px;
  width: 100%;
  cursor: pointer;
  margin-bottom: 0.25rem;
}

.sidebar-menu-item-link {
  width: 100%;
  height: 100%;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  border-radius: 0.5rem;
  font-size: 0.975rem;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0.75rem 1.5rem;
  transition: all .2s ease;
  text-decoration: none;
}

.sidebar-menu-item-link:hover {
  color: var(--bs-blue);
  background-color: #e0f0ff;
}

body.dark .sidebar-menu-item-link:hover {
  background-color: rgba(60, 140, 243, 0.1);
}

.sidebar-menu-item.active > .sidebar-menu-item-link {
  color: var(--bs-white);
  background: var(--bs-blue);
}

.sidebar-menu-item-icon {
  min-width: 2.5rem;
  display: flex;
  justify-content: center;
  font-size: 1.2rem;
  margin-right: 0.5rem;
}

/* === SUBMENU === */
.has-submenu .sidebar-menu-item-link {
  padding-right: 3rem;
}

.submenu-arrow {
  position: absolute;
  right: 1.5rem;
  top: 50%;
  transform: translateY(-50%) rotate(0deg);
  font-size: 1rem;
  color: var(--text-secondary);
  transition: transform 0.3s ease, color 0.3s ease;
  pointer-events: none;
  z-index: 10;
}

.has-submenu .sidebar-menu-item-link:hover + .submenu-arrow {
  color: var(--bs-blue);
}

.submenu-arrow.rotated {
  transform: translateY(-50%) rotate(90deg);
  color: var(--text-primary);
}

.submenu {
  list-style: none;
  padding: 0;
  margin: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.5s ease-in-out, opacity 0.3s ease;
}

.submenu.show {
  max-height: 1000px;
  opacity: 1;
  transition: max-height 0.5s ease-in-out, opacity 0.3s ease 0.2s;
}

.submenu .sidebar-menu-item {
  height: 40px;
}

.submenu .sidebar-menu-item-link {
  padding: 0.5rem 1rem;
  background: transparent;
}

.submenu .sidebar-menu-item-link:hover {
  background: var(--bg-primary);
}

/* === SIDEBAR COLLAPSED BEHAVIOR === */
.admin-dashboard.sidebar-collapsed .sidebar .sidebar-logo span,
.admin-dashboard.sidebar-collapsed .sidebar .sidebar-menu-item-text,
.admin-dashboard.sidebar-collapsed .sidebar .submenu-arrow,
.admin-dashboard.sidebar-collapsed .sidebar .sidebar-menu-header,
.admin-dashboard.sidebar-collapsed .sidebar .logout-btn-text {
  opacity: 0;
  display: none;
  pointer-events: none;
}

.admin-dashboard.sidebar-collapsed .sidebar .sidebar-menu-item-link,
.admin-dashboard.sidebar-collapsed .sidebar .logout-btn {
  justify-content: center;
  padding: 0.75rem;
}

.admin-dashboard.sidebar-collapsed .sidebar .sidebar-menu-item-icon,
.admin-dashboard.sidebar-collapsed .sidebar .logout-btn-icon {
  margin-right: 0;
  min-width: auto;
}

.admin-dashboard.sidebar-collapsed .sidebar .submenu {
  display: none;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover {
  width: var(--sidebar-width);
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-logo span,
.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-menu-item-text,
.admin-dashboard.sidebar-collapsed .sidebar:hover .logout-btn-text {
  opacity: 1;
  display: block;
  pointer-events: auto;
  transition: opacity .3s ease .1s;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-menu-header {
  opacity: 1;
  display: flex;
  pointer-events: auto;
  transition: opacity .3s ease .1s;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .submenu-arrow {
  opacity: 1;
  display: block;
  pointer-events: auto;
  transition: opacity .3s ease .1s;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-menu-item-link,
.admin-dashboard.sidebar-collapsed .sidebar:hover .logout-btn {
  justify-content: flex-start;
  padding: 0.75rem 1.5rem;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-menu-item-icon,
.admin-dashboard.sidebar-collapsed .sidebar:hover .logout-btn-icon {
  margin-right: 0.5rem;
  min-width: 2.5rem;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .submenu {
  display: block;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .submenu .sidebar-menu-item-link {
  padding: 0.5rem 1rem;
}

/* === SIDEBAR FOOTER === */
.sidebar-footer {
  margin-top: auto;
  padding: 1rem;
  border-top: 1px solid var(--border-color);
}

.logout-btn {
  color: var(--bs-red);
  display: flex;
  align-items: center;
  padding: 0.75rem 1.5rem;
  border-radius: 0.5rem;
  transition: all .2s ease;
  white-space: nowrap;
  width: 100%;
  text-decoration: none;
  background: var(--bg-secondary);
  margin: 0.25rem 0;
}

.logout-btn:hover {
  background: var(--bs-red);
  color: var(--bs-white);
}

.logout-btn-icon {
  font-size: 1.5rem;
  min-width: 2.5rem;
  text-align: center;
  margin-right: 0.5rem;
}

/* === REAL-TIME TOGGLE === */
.sidebar-toggle-btn {
  color: var(--text-primary);
  display: flex;
  align-items: center;
  padding: 0.75rem 1.5rem;
  border-radius: 0.5rem;
  transition: all .2s ease;
  white-space: nowrap;
  width: 100%;
  background: var(--bg-secondary);
  margin: 0.25rem 0;
}

.sidebar-toggle-btn:hover {
  background: var(--hover-bg-color);
}

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  margin-right: 0.5rem;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 22px;
}

.toggle-slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .toggle-slider {
  background-color: var(--bs-blue);
}

input:checked + .toggle-slider:before {
  transform: translateX(18px);
}

/* Collapsed State */
.admin-dashboard.sidebar-collapsed .sidebar .sidebar-toggle-text {
  opacity: 0;
  display: none;
}

.admin-dashboard.sidebar-collapsed .sidebar .sidebar-toggle-btn {
  justify-content: center;
  padding: 0.75rem;
}

.admin-dashboard.sidebar-collapsed .sidebar .toggle-switch {
  margin-right: 0;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-toggle-text {
  opacity: 1;
  display: block;
  transition: opacity .3s ease .1s;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .sidebar-toggle-btn {
  justify-content: flex-start;
  padding: 0.75rem 1.5rem;
}

.admin-dashboard.sidebar-collapsed .sidebar:hover .toggle-switch {
  margin-right: 0.5rem;
}

/* === NOTIFICATIONS === */
.notification-dropdown {
  position: relative;
}

.notification-btn {
  position: relative;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  width: 40px;
  height: 40px;
  border-radius: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s ease;
}

.notification-btn:hover,
.notification-dropdown.active .notification-btn {
  background: var(--bg-primary);
  color: var(--text-primary);
}

.notification-badge {
  position: absolute;
  top: 5px;
  right: 5px;
  background: var(--bs-red);
  color: white;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: bold;
  border: 2px solid var(--bg-secondary);
}

.notification-dropdown-content {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 360px;
  background: var(--bg-secondary);
  border-radius: 1rem;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid var(--border-color);
  z-index: 1001;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px) scale(0.95);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.notification-dropdown.active .notification-dropdown-content {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.notification-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notification-header-title {
  font-weight: 600;
  color: var(--text-primary);
}

.notification-list {
  max-height: 320px;
  overflow-y: auto;
}

.notification-item {
  display: flex;
  gap: 1rem;
  padding: 1rem;
  border-bottom: 1px solid var(--border-color);
  transition: background-color 0.2s ease;
  cursor: pointer;
  position: relative;
}

.notification-item:last-child { 
  border: none; 
}

.notification-item:hover {
  background-color: var(--bg-primary);
}

.notification-item.unread::after {
  content: '';
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  background-color: var(--bs-blue);
  border-radius: 50%;
}

.notification-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: white;
}

.notification-content {
  flex-grow: 1;
}

.notification-message {
  font-size: 0.9rem;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}

.notification-time {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.notification-footer {
  padding: 0.75rem;
  text-align: center;
  border-top: 1px solid var(--border-color);
  background-color: var(--bg-primary);
}

/* === TOGGLES & SWITCHES === */
.dark-mode-switch,
.dark-mode-toggle,
.toggle-switch {
  position: relative;
  cursor: pointer;
  transition: background-color .3s;
}

.dark-mode-switch,
.dark-mode-toggle {
  width: 50px;
  height: 25px;
  background-color: #ccc;
  border-radius: 25px;
}

.toggle-switch {
  display: inline-block;
  width: 38px;
  height: 22px;
}

.dark-mode-switch .slider,
.dark-mode-toggle .slider {
  position: absolute;
  height: 21px;
  width: 21px;
  background-color: white;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: transform .3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dark-mode-switch .slider i,
.dark-mode-toggle .slider i {
  color: #ffc107;
  transition: color .3s ease;
  font-size: 0.8rem;
}

body.dark .dark-mode-switch,
body.dark .dark-mode-toggle {
  background-color: var(--bs-blue);
}

body.dark .dark-mode-switch .slider,
body.dark .dark-mode-toggle .slider {
  transform: translateX(25px);
  background-color: var(--bg-primary);
}

body.dark .dark-mode-switch .slider i,
body.dark .dark-mode-toggle .slider i {
  color: var(--text-primary);
}

/* Specific positioning */
.auth-container .dark-mode-toggle {
  position: absolute;
  top: 1rem;
  right: 1rem;
  z-index: 10;
}

.navbar .dark-mode-toggle {
  position: relative;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 22px;
}

.toggle-slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .toggle-slider {
  background-color: var(--bs-blue);
}

input:checked + .toggle-slider:before {
  transform: translateX(16px);
}

/* === FORM CONTROLS === */
.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid var(--border-color);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  transition: border-color .2s ease, background-color .2s ease;
  outline: none;
  font-family: inherit;
}

.form-select {
  padding: 12px 16px;
  cursor: pointer;
}

.form-textarea {
  padding: 12px 16px;
  resize: vertical;
  min-height: 100px;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--bs-blue);
}

/* === FILE UPLOADS === */
.profile-picture-upload,
.signature-upload {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background-color: var(--bg-primary);
  border: 2px dashed var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  transition: all 0.2s ease;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.profile-picture-upload:hover,
.signature-upload:hover {
  border-color: var(--bs-blue);
}

.signature-upload {
  border-radius: 0.75rem;
  width: 100%;
  max-width: 300px;
  height: 150px;
  margin-top: 1.5rem;
}

.upload-icon {
  font-size: 2.5rem;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}

.upload-text {
  font-size: 0.85rem;
  color: var(--text-secondary);
  text-align: center;
  padding: 0 0.5rem;
}

/* === MODALS === */
.modal-backdrop {
  backdrop-filter: blur(4px);
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 1000;
}

.modal-content {
  background-color: var(--bg-secondary) !important;
  color: var(--text-primary) !important;
  box-shadow: var(--shadow);
  transition: background-color 0.3s ease, color 0.3s ease;
}

.modal-title {
  color: var(--text-primary) !important;
}

.modal-text {
  color: var(--text-secondary) !important;
}

/* === NOTIFICATIONS & TOASTS === */
.toast-notification {
  position: fixed;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  padding: 1rem 2rem;
  border-radius: 0.5rem;
  z-index: 9999;
  background-color: var(--bs-green);
  color: white;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  transition: top 0.5s ease-in-out;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.toast-notification.show { 
  top: 1rem; 
}

.toast-notification.toast-error { 
  background-color: var(--bs-red); 
}

.toast-notification.toast-warning { 
  background-color: var(--bs-yellow); 
  color: #111; 
}

.toast-notification.toast-info { 
  background-color: var(--bs-blue); 
}

.toast-notification i {
  font-size: 1.5rem;
}

#toastMessage {
  flex: 1;
  font-weight: 500;
}

/* === LOADER === */
.loader-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 9999;
  display: none;
}

.loader-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(100, 100, 100, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.loader {
  --size: 250px;
  --duration: 2s;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  height: var(--size);
  aspect-ratio: 1;
}

.loader .box {
  position: absolute;
  background: rgba(100, 100, 100, 0.1);
  border-radius: 50%;
  border-top: 1px solid rgba(150, 150, 150, 0.5);
  box-shadow: rgba(0, 0, 0, 0.2) 0px 10px 10px -0px;
  animation: rippleLogin var(--duration) infinite ease-in-out;
}

.loader .box:nth-child(1) { inset: 40%; z-index: 99; }
.loader .box:nth-child(2) { inset: 30%; z-index: 98; animation-delay: 0.2s; }
.loader .box:nth-child(3) { inset: 20%; z-index: 97; animation-delay: 0.4s; }
.loader .box:nth-child(4) { inset: 10%; z-index: 96; animation-delay: 0.6s; }
.loader .box:nth-child(5) { inset: 0%; z-index: 95; animation-delay: 0.8s; }

.loader .logo {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  padding: 30%;
}

.loader .logo img {
  width: 100%;
  height: auto;
